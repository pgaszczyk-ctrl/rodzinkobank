<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groszaki · naprawa skrzynki</title>
<style>
body{margin:0;background:#f8eedb;color:#4c3023;font:16px/1.5 system-ui,sans-serif}
main{max-width:880px;margin:auto;padding:16px}
h1,h2{font-family:Georgia,serif;margin:.4em 0}
h1{font-size:30px}
h2{font-size:21px}
svg{display:block;width:100%;height:auto;background:#f4d78f;border-radius:8px}
.phone{width:min(100%,390px)}
@media(max-width:422px){.phone{width:min(calc(100% + 32px),390px);margin-left:max(-16px,calc((100% - 390px)/2))}.phone figcaption{padding-inline:16px}}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
button{padding:6px 10px;border:1px solid #9c7256;border-radius:6px;background:#fff8ea;color:inherit;font:inherit;cursor:pointer}
button[aria-pressed=true]{background:#653e2a;color:#fff}
figcaption{margin-top:4px}
figure{margin:0}
</style>
<main>
<h1>Groszaki · naprawa skrzynki</h1>
<h2>Jesienna mapa</h2>
<figure><svg id="map" viewBox="0 0 2000 1116" role="img" aria-label="Cała jesienna mapa z Groszakiem przy rynku">
<image href="../../../zrodla/mapa-jesien.jpg" width="2000" height="1116"/>
<use href="#market"/>
</svg></figure>
<h2>Kamera rozgrywki</h2>
<figure class="phone">
<svg id="phone" viewBox="555 516 370 278" role="img" aria-label="Groszak naprawia skrzynkę obok straganu">
<image href="../../../zrodla/mapa-jesien.jpg" width="2000" height="1116"/>
<g id="market">
<image href="cien-sprzedawczyni.png" x="793" y="728.5" width="24" height="7"/>
<image href="sprzedawczyni.png" x="793" y="696" width="25" height="37"/>
<image href="cien-skrzynka.png" x="659.5" y="757" width="29" height="8"/>
<image href="skrzynka.png" x="658" y="735" width="33" height="26"/>
<image href="cien-groszak.png" x="632" y="762" width="26" height="8"/>
<g transform="translate(645 765)">
<image href="../../../miedziany/nozka.webp" x="-7" y="-8" width="4" height="9"/>
<image href="../../../miedziany/nozka.webp" x="2" y="-8" width="4" height="9"/>
<g id="body">
<image href="../../../miedziany/raczka.webp" x="-13" y="-17" width="4.5" height="11" transform="rotate(24 -11 -16)"/>
<image href="../../../miedziany/korpus.webp" x="-12" y="-29" width="24" height="24"/>
<image href="../../../miedziany/buzia-usmiech.webp" x="-6" y="-20" width="12" height="10"/>
<g id="arm">
<image href="../../../miedziany/raczka.webp" x="-2.2" y="0" width="4.5" height="12"/>
<g transform="translate(0 10)">
<image href="mlotek.png" x="-2.61" y="-11.74" width="15" height="15" style="filter:contrast(1.22) saturate(.83)"/>
</g>
</g>
</g>
</g>
<circle cx="663.13" cy="752.17" r="1" fill="#523827" stroke="#e9be7d" stroke-width=".45"/>
</g>
</svg>
<figcaption>390 CSS px przy dostępnej szerokości ekranu · kadr 370 × 278 px mapy</figcaption>
</figure>
<div class="controls" aria-label="Sterowanie animacją">
<button id="play" type="button">Odtwórz</button>
<label><input id="reduce" type="checkbox"> Ogranicz ruch</label>
<button type="button" data-pose="0">Przygotowanie</button>
<button type="button" data-pose="1">Zamach</button>
<button type="button" data-pose="2">Uderzenie</button>
<button type="button" data-pose="3">Pauza</button>
</div>
<h2>Proporcje Groszaka</h2>
<figure class="phone">
<svg viewBox="0 0 390 160" role="img" aria-label="Porównanie poprzedniego Groszaka z wersją z zatwierdzonych części">
<image href="groszak-v1.png" x="38" y="12" width="110" height="110"/>
<image href="../../../miedziany/nozka.webp" x="260" y="91" width="12" height="29"/>
<image href="../../../miedziany/nozka.webp" x="287" y="91" width="12" height="29"/>
<image href="../../../miedziany/raczka.webp" x="240" y="66" width="12" height="35" transform="rotate(23 246 68)"/>
<image href="../../../miedziany/raczka.webp" x="306" y="66" width="12" height="35" transform="rotate(-23 311 68)"/>
<image href="../../../miedziany/korpus.webp" x="238" y="14" width="84" height="84"/>
<image href="../../../miedziany/buzia-usmiech.webp" x="258" y="45" width="44" height="36"/>
<text x="94" y="143" text-anchor="middle">Poprzednia wersja</text>
<text x="280" y="143" text-anchor="middle">Części z repozytorium</text>
</svg>
</figure>
</main>
<script>
const poses = [{"pose": "przygotowanie", "ms": 0, "arm": -35, "body": 1}, {"pose": "zamach", "ms": 560, "arm": -151, "body": -8}, {"pose": "uderzenie", "ms": 700, "arm": 0, "body": 0}, {"pose": "pauza", "ms": 920, "arm": 0, "body": 0}, {"pose": "powrot", "ms": 1320, "arm": -35, "body": 1}];
const arm = document.querySelector('#arm');
const body = document.querySelector('#body');
const play = document.querySelector('#play');
const reduce = document.querySelector('#reduce');
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
const buttons = [...document.querySelectorAll('[data-pose]')];
let animation = null;

function render(armAngle, bodyAngle, index) {
  body.setAttribute('transform', 'rotate(' + bodyAngle + ' 0 -7)');
  arm.setAttribute('transform', 'translate(9 -15) rotate(' + armAngle + ')');
  buttons.forEach((button, i) => button.setAttribute('aria-pressed', i === index));
}
function stop() {
  if (animation !== null) cancelAnimationFrame(animation);
  animation = null;
  play.textContent = 'Odtwórz';
}
function setReduced(value) {
  reduce.checked = value;
  play.disabled = value;
  if (value) stop();
}
buttons.forEach((button, i) => button.addEventListener('click', () => {
  stop();
  render(poses[i].arm, poses[i].body, i);
}));
play.addEventListener('click', () => {
  if (animation !== null) {
    stop();
    return;
  }
  if (reduce.checked) return;
  play.textContent = 'Zatrzymaj';
  const start = performance.now();
  function frame(now) {
    const elapsed = (now - start) % poses.at(-1).ms;
    const index = poses.findIndex((pose, i) => i > 0 && elapsed < pose.ms) - 1;
    const a = poses[index];
    const b = poses[index + 1];
    const fraction = (elapsed - a.ms) / (b.ms - a.ms);
    const progress = index === 1 ? fraction ** 2 : fraction ** 2 * (3 - 2 * fraction);
    render(a.arm + (b.arm - a.arm) * progress, a.body + (b.body - a.body) * progress, index);
    animation = requestAnimationFrame(frame);
  }
  animation = requestAnimationFrame(frame);
});
reduce.addEventListener('change', () => setReduced(reduce.checked));
motionPreference.addEventListener('change', event => setReduced(event.matches));
setReduced(motionPreference.matches);
render(poses[0].arm, poses[0].body, 0);
</script>
</html>
