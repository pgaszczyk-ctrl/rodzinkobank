<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Groszaki</title>
<meta name="description" content="Groszaki – rodzinna aplikacja do nauki oszczędzania i cierpliwości." />
<meta name="theme-color" content="#fdfbf4" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='22' fill='%23fbbf24' stroke='%23d97706' stroke-width='4'/%3E%3Cpath d='M12 22 q20 -24 40 0z' fill='%23fbbf24' stroke='%23b45309' stroke-width='3'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/tailwind.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="assets/app.css" />
</head>
<body class="font-body antialiased">
<a href="#vaultTitle" class="sr-only focus:not-sr-only" data-i18n="a11y.skip"></a>

<div class="max-w-6xl mx-auto px-4 sm:px-6 pb-12">
  <!-- Header -->
  <header class="flex items-center justify-between gap-3 pt-5 pb-3">
    <div class="flex items-center gap-2.5 min-w-0">
      <span id="logoMark" aria-hidden="true"></span>
      <div class="min-w-0">
        <h1 class="font-display font-extrabold text-3xl sm:text-4xl leading-none text-ink" id="brand">Grosz<span class="text-berry-500">aki</span></h1>
        <p class="text-sm font-bold text-ink/60 truncate" id="greeting"></p>
      </div>
    </div>
    <button id="parentBtn" class="shrink-0 inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-bold text-ink/55 hover:text-ink hover:bg-white/70 ring-1 ring-ink/10">
      <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <span data-i18n="nav.parent"></span>
    </button>
  </header>
  <nav id="kidTabs" class="flex flex-wrap gap-2 min-h-0" aria-label=""></nav>
  <div id="modeBar" class="flex flex-wrap justify-end gap-2"></div>

  <main>
    <!-- 1. Mój Skarbiec -->
    <section aria-labelledby="vaultTitle" class="mt-5">
      <div class="brick bg-white p-5 sm:p-7 pt-8">
        <div class="studs stud-white"><span></span><span></span><span></span><span></span></div>
        <h2 id="vaultTitle" class="font-display font-extrabold text-xl sm:text-2xl" data-i18n="kid.vaultTitle"></h2>
        <div class="mt-3 grid gap-5 lg:grid-cols-[1fr_auto] lg:items-center">
          <div class="flex items-center gap-3 sm:gap-5 min-w-0">
            <div id="mascot" class="w-16 sm:w-24 shrink-0"></div>
            <div class="min-w-0 flex-1">
              <p class="font-bold text-ink/55 text-sm sm:text-base" id="balanceLabel" data-i18n="kid.balanceLabel"></p>
              <div id="balance" class="balance font-display font-extrabold text-berry-600" aria-live="off"></div>
              <div id="tickRow" class="mt-3 max-w-sm">
                <div class="flex justify-between gap-2 text-xs sm:text-sm font-bold text-ink/55 mb-1"><span id="tickText"></span></div>
                <div class="tick-track"><div id="tickFill" class="tick-fill" style="width:0%"></div></div>
              </div>
            </div>
          </div>
          <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-1 lg:w-72">
            <div id="nextChest" class="rounded-3xl bg-sun-50 ring-2 ring-sun-100 p-3.5 flex items-center gap-3"></div>
            <div id="nowBox" class="rounded-3xl bg-sky-50 ring-2 ring-sky-100 p-3.5" hidden></div>
          </div>
        </div>
        <div id="vaultNote" class="mt-4" hidden></div>
        <div id="requestBox" class="mt-4"></div>
      </div>
    </section>

    <!-- 2. Kopalnia Marzeń -->
    <section aria-labelledby="mineTitle" class="mt-8">
      <div class="brick bg-white p-3 sm:p-5 pt-7">
        <div class="studs stud-sun"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="px-2 flex flex-wrap items-end justify-between gap-2">
          <div>
            <h2 id="mineTitle" class="font-display font-extrabold text-xl sm:text-2xl" data-i18n="kid.mineTitle"></h2>
            <p id="mineSub" class="text-sm font-semibold text-ink/60"></p>
          </div>
          <p id="crew" class="text-xs font-bold text-ink/50"></p>
        </div>
        <p id="sceneTitle" class="sr-only" data-i18n="scene.title"></p>
        <p id="sceneDesc" class="sr-only"></p>
        <div id="sceneScroll" class="scene-scroll mt-3" tabindex="0" data-i18n-aria="scene.scrollHint"><div id="scene"></div></div>
      </div>
    </section>

    <!-- 3. Moje marzenia -->
    <section aria-labelledby="dreamsTitle" class="mt-8">
      <h2 id="dreamsTitle" class="font-display font-extrabold text-2xl sm:text-3xl" data-i18n="kid.dreamsTitle"></h2>
      <p class="font-semibold text-ink/60" data-i18n="kid.dreamsSub"></p>
      <div id="dreams" class="grid md:grid-cols-3 gap-6 mt-6"></div>
    </section>
  </main>

  <footer class="mt-10 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-sm font-bold text-ink/40">
    <span id="footerText"></span>
    <span aria-hidden="true">·</span>
    <span id="langSwitch" class="inline-flex gap-1"></span>
    <button id="unlinkBtn" class="underline hover:text-berry-500" hidden data-i18n="footer.unlink"></button>
  </footer>
</div>

<!-- Withdrawal request (child) -->
<dialog id="withdrawDialog" aria-labelledby="wdTitle">
  <form method="dialog" class="brick bg-white p-6 pt-8 m-0" id="wdForm">
    <div class="studs stud-berry"><span></span><span></span><span></span></div>
    <h3 id="wdTitle" class="font-display font-extrabold text-2xl" data-i18n="wd.title"></h3>
    <div id="wdBody" class="mt-3"></div>
    <div class="mt-5 flex justify-end gap-3">
      <button value="cancel" formnovalidate class="px-4 py-2 rounded-2xl font-bold text-ink/60 hover:bg-ink/5" data-i18n="common.cancel"></button>
      <button value="ok" id="wdSubmit" class="btn bg-berry-500 hover:bg-berry-600 text-white" data-i18n="wd.submit"></button>
    </div>
  </form>
</dialog>

<!-- Chest celebration -->
<dialog id="celebrateDialog" aria-labelledby="celTitle">
  <div class="brick bg-white p-6 pt-8 m-0 text-center overflow-hidden relative">
    <div id="celArt" class="relative mx-auto w-56 h-48"></div>
    <h3 id="celTitle" class="font-display font-extrabold text-3xl mt-2"></h3>
    <p id="celText" class="font-bold text-ink/70 mt-1"></p>
    <button id="celOk" class="btn bg-sun-400 hover:bg-sun-500 text-ink mt-5 px-8" data-i18n="cel.ok"></button>
  </div>
</dialog>

<!-- Parent zone -->
<dialog id="parentDialog" class="wide" aria-labelledby="pzTitle">
  <div class="brick bg-white m-0 max-h-[92vh] flex flex-col">
    <div class="flex items-start justify-between gap-3 p-5 pb-2 pt-6">
      <div class="min-w-0">
        <h3 id="pzTitle" class="font-display font-extrabold text-2xl" data-i18n="pz.title"></h3>
        <p id="pzSub" class="text-sm font-semibold text-ink/60"></p>
      </div>
      <div class="flex items-center gap-1">
        <button id="pzLock" class="px-3 py-2 rounded-xl text-sm font-bold text-ink/50 hover:bg-ink/5" hidden data-i18n="pz.lock"></button>
        <button id="pzClose" class="w-10 h-10 rounded-xl hover:bg-ink/5 grid place-items-center text-2xl font-bold text-ink/50" data-i18n-aria="common.close">×</button>
      </div>
    </div>
    <div id="pzGate" class="px-5 pb-6"></div>
    <div id="pzMain" hidden class="flex flex-col min-h-0">
      <div id="pzKids" class="px-5 flex flex-wrap gap-2"></div>
      <div class="tabbar px-5 mt-3 flex gap-1 border-b-2 border-sky-100" role="tablist" id="pzTabs"></div>
      <div id="pzBody" class="p-5 overflow-y-auto"></div>
    </div>
  </div>
</dialog>

<!-- Welcome (cloud) -->
<div id="welcome" hidden class="fixed inset-0 z-50 overflow-y-auto bg-[#fdfbf4]">
  <div class="min-h-full grid place-items-center p-4">
    <div class="brick bg-white p-6 sm:p-8 pt-10 w-full max-w-lg text-center pop-in">
      <div class="studs stud-white"><span></span><span></span><span></span><span></span></div>
      <div id="welcomeArt" class="w-24 mx-auto"></div>
      <h2 class="font-display font-extrabold text-4xl" id="welcomeBrand"></h2>
      <p class="font-bold text-ink/60 mt-1" data-i18n="welcome.tagline"></p>
      <div class="grid gap-3 mt-6 text-left">
        <button id="wParent" class="text-left rounded-3xl bg-sun-100 hover:bg-sun-200 p-4 shadow-brickSm">
          <span class="block font-display font-extrabold text-xl" data-i18n="welcome.parent"></span>
          <span class="block text-sm font-bold text-ink/60" data-i18n="welcome.parentSub"></span>
        </button>
        <button id="wKid" class="text-left rounded-3xl bg-mint-100 hover:bg-mint-200 p-4 shadow-brickSm">
          <span class="block font-display font-extrabold text-xl" data-i18n="welcome.kid"></span>
          <span class="block text-sm font-bold text-ink/60" data-i18n="welcome.kidSub"></span>
        </button>
        <p id="wKidInfo" hidden class="rounded-2xl bg-mint-50 p-4 text-sm font-bold text-ink/70" data-i18n="welcome.kidInfo"></p>
        <button id="wLocal" class="rounded-2xl p-3 font-bold text-ink/50 hover:bg-ink/5 text-center" data-i18n="welcome.local"></button>
      </div>
      <p id="wError" hidden class="mt-3 text-sm font-bold text-berry-600"></p>
    </div>
  </div>
</div>

<!-- Parent account -->
<dialog id="authDialog" aria-labelledby="authTitle">
  <form id="authForm" class="brick bg-white p-6 pt-8 m-0">
    <div class="studs stud-white"><span></span><span></span><span></span></div>
    <div class="flex items-start justify-between">
      <h3 id="authTitle" class="font-display font-extrabold text-2xl" data-i18n="auth.title"></h3>
      <button type="button" id="authClose" class="w-10 h-10 rounded-xl hover:bg-ink/5 text-2xl font-bold text-ink/50" data-i18n-aria="common.close">×</button>
    </div>
    <div class="flex bg-sky-50 rounded-2xl p-1 mt-3" role="tablist">
      <button type="button" data-auth="login" class="authTab flex-1 py-2 rounded-xl font-bold" data-i18n="auth.login"></button>
      <button type="button" data-auth="signup" class="authTab flex-1 py-2 rounded-xl font-bold" data-i18n="auth.signup"></button>
    </div>
    <div class="grid gap-3 mt-4">
      <label class="block"><span class="text-sm font-bold text-ink/70" data-i18n="auth.email"></span>
        <input id="authEmail" type="email" required autocomplete="email" class="field mt-1" /></label>
      <label class="block"><span class="text-sm font-bold text-ink/70" data-i18n="auth.password"></span>
        <input id="authPass" type="password" required minlength="8" autocomplete="current-password" class="field mt-1" /></label>
    </div>
    <p id="authMsg" hidden class="mt-3 text-sm font-bold rounded-2xl p-3"></p>
    <div class="mt-5 flex items-center justify-between gap-3">
      <button type="button" id="authForgot" class="text-sm font-bold text-ink/50 underline" data-i18n="auth.forgot"></button>
      <button id="authSubmit" class="btn bg-grape-500 hover:bg-grape-600 text-white"></button>
    </div>
  </form>
</dialog>

<!-- Onboarding (new parent account) -->
<dialog id="onboardDialog" aria-labelledby="obTitle">
  <div class="brick bg-white p-6 pt-8 m-0">
    <div class="studs stud-white"><span></span><span></span><span></span></div>
    <h3 id="obTitle" class="font-display font-extrabold text-2xl" data-i18n="ob.title"></h3>
    <p class="text-sm font-semibold text-ink/60" data-i18n="ob.sub"></p>
    <form id="obCreate" class="mt-4 bg-sun-50 rounded-2xl p-4 grid gap-2">
      <label class="block"><span class="text-sm font-bold text-ink/70" data-i18n="ob.kidName"></span>
        <input id="obKid" required maxlength="30" class="field mt-1" /></label>
      <button class="justify-self-end btn bg-sun-400 hover:bg-sun-500" data-i18n="ob.create"></button>
    </form>
    <form id="obJoin" class="mt-3 bg-sky-50 rounded-2xl p-4 grid gap-2">
      <label class="block"><span class="text-sm font-bold text-ink/70" data-i18n="ob.code"></span>
        <input id="obCode" required maxlength="12" class="field mt-1 uppercase tracking-widest" /></label>
      <button class="justify-self-end btn bg-sky-500 hover:bg-sky-600 text-white" data-i18n="ob.join"></button>
    </form>
    <div class="mt-4 text-right"><button id="obLogout" class="text-sm font-bold text-ink/50 underline" data-i18n="auth.logout"></button></div>
  </div>
</dialog>

<div id="toast" hidden role="status" class="fixed bottom-5 left-1/2 z-[60] max-w-[calc(100vw-32px)] px-5 py-3 rounded-2xl font-bold"></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
