<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Groszaki</title>
<meta name="description" content="Groszaki – rodzinny bank dla dzieci. Pieniądze pracują w miasteczku i rosną co kilka sekund." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  if (window.tailwind) tailwind.config = {
    theme: {
      extend: {
        fontFamily: { display: ['"Baloo 2"', 'system-ui', 'sans-serif'], body: ['Nunito', 'system-ui', 'sans-serif'] },
        colors: { ink: '#4a2c1a', cream: '#fdf6e7', line: '#ecd9b8' },
      },
    },
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { color-scheme: light; --bg: #fdf6e7; --ink: #4a2c1a; --card: #fffaf0; --line: #ecd9b8; --ok: #2f7a3a; --warn: #b4532a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Nunito, system-ui, sans-serif; }
  body { overflow-x: hidden; }
  button, input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 48px; }
  .topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 0 4px; }
  .topbar h1 { font: 800 22px/1 "Baloo 2", system-ui, sans-serif; margin: 0; }
  .kidtabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font-weight: 700; cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pill.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .ml-auto { margin-left: auto; }
  .note { font-size: 13px; opacity: .75; }
  .saldo { text-align: center; margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
  .saldo .big { font: 800 clamp(34px, 11vw, 60px)/1.05 "Baloo 2", system-ui, sans-serif; letter-spacing: -0.5px; transition: color .4s, text-shadow .4s; white-space: nowrap; }
  .saldo .big.flash { color: #c27a00; text-shadow: 0 0 14px rgba(255, 200, 60, .7); }
  .saldo .micro { font-size: .45em; font-weight: 700; opacity: .7; margin-left: 1px; cursor: pointer; }
  .saldo .cur { font-size: .55em; margin-left: 6px; }
  .saldo .sub { font-size: 13px; opacity: .7; }
  .tip { display: inline-block; margin-top: 4px; font-size: 13px; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .map-wrap { position: relative; width: 100%; aspect-ratio: 2000 / 1116; border-radius: 16px; overflow: hidden;
    border: 2px solid var(--line); background: #f1e3c6; touch-action: none; user-select: none; -webkit-user-select: none; }
  @media (max-width: 600px) { .map-wrap { aspect-ratio: 4 / 5; } }
  .map-wrap canvas { display: block; width: 100%; height: 100%; }
  h2.sec { font: 800 20px/1.2 "Baloo 2", system-ui, sans-serif; margin: 22px 0 8px; }
  footer { text-align: center; font-size: 12px; opacity: .55; margin-top: 30px; }

  /* okna */
  dialog { border: 0; padding: 0; border-radius: 20px; background: var(--card); color: var(--ink); max-width: min(560px, calc(100vw - 24px)); width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(60, 35, 20, .45); }
  .dlg { padding: 18px; }
  .dlg h3 { font: 800 22px/1.2 "Baloo 2", system-ui, sans-serif; margin: 0 0 10px; }
  .field { display: grid; gap: 4px; margin: 8px 0; font-weight: 700; font-size: 14px; }
  .field input, .field select { padding: 9px 11px; border: 2px solid var(--line); border-radius: 12px; background: #fff; font-weight: 600; width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .row > .field { flex: 1 1 140px; }
  .btn { border: 2px solid var(--ink); background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 800; cursor: pointer; }
  .btn.light { background: #fff; color: var(--ink); }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: progress; }
  .msg { margin-top: 10px; border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 14px; }
  .msg.err { background: #fde8e4; color: #a33a22; }
  .msg.ok { background: #e6f5e4; color: var(--ok); }
  .tabs2 { display: flex; background: #f3e6cc; border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 8px; }
  .tabs2 button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 7px; font-weight: 800; cursor: pointer; }
  .tabs2 button[aria-pressed="true"] { background: #fff; }

  /* ekran powitalny */
  #welcome { position: fixed; inset: 0; z-index: 30; overflow-y: auto; background: var(--bg); display: grid; place-items: center; padding: 20px; }
  #welcome .box { max-width: 460px; text-align: center; }
  #welcome h2 { font: 800 34px/1.1 "Baloo 2", system-ui, sans-serif; margin: 6px 0; }
  #welcome .stack { display: grid; gap: 10px; margin-top: 16px; }
  #welcome img { width: 140px; height: auto; }

  /* strefa rodzica */
  #parentDialog { max-width: min(980px, calc(100vw - 16px)); }
  #parentDialog .head { position: sticky; top: 0; z-index: 2; background: var(--card); padding: 14px 18px 8px; border-bottom: 2px solid var(--line); }
  #parentDialog .head h3 { margin: 0; }
  .ptabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .ptabs button { white-space: nowrap; }
  .psec { padding: 14px 18px 22px; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; margin: 10px 0; }
  .card h4 { margin: 0 0 6px; font: 800 17px/1.2 "Baloo 2", system-ui, sans-serif; }
  .kidlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .kidcard { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; cursor: pointer; }
  .kidcard[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 3px 0 rgba(74,44,26,.25); }
  .kidcard b { display: block; font: 800 17px/1.2 "Baloo 2", system-ui, sans-serif; }
  table.hist { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  table.hist th { text-align: left; font-size: 12px; opacity: .65; padding: 6px; }
  table.hist td { border-top: 1px solid var(--line); padding: 7px 6px; vertical-align: top; }
  table.hist td.n, table.hist th.n { text-align: right; white-space: nowrap; }
  .tablewrap { overflow-x: auto; }
  @media (max-width: 600px) {
    table.hist thead { display: none; }
    table.hist tr { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 10px; border-top: 1px solid var(--line); padding: 8px 4px; }
    table.hist td { border: 0; padding: 0; }
    table.hist td:nth-child(1) { grid-column: 1; font-size: 12px; opacity: .7; }
    table.hist td:nth-child(2) { grid-column: 1 / 3; grid-row: 2; }
    table.hist td:nth-child(3) { grid-column: 2; grid-row: 1; font-weight: 800; }
    table.hist td:nth-child(4), table.hist td:nth-child(5) { grid-row: 3; font-size: 12px; opacity: .8; text-align: left; }
    table.hist td:nth-child(4) { grid-column: 1; } table.hist td:nth-child(5) { grid-column: 2; }
    table.hist td:nth-child(4):not(:empty)::before { content: attr(data-l) ' '; }
    table.hist td:nth-child(5)::before { content: attr(data-l) ' '; }
    table.hist td:nth-child(6) { grid-column: 3; grid-row: 1 / 4; align-self: center; }
    table.hist tbody tr:first-child { border-top: 0; }
  }
  .plus { color: var(--ok); } .minus { color: var(--warn); }
  .summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .summary div { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 13px; }
  .summary b { display: block; font-size: 16px; }
  .list { display: grid; gap: 6px; }
  .list .item { display: flex; gap: 8px; align-items: center; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 7px 10px; }
  .list .item span { flex: 1; }
  .x { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; opacity: .55; padding: 2px 6px; }
  .qr { width: 120px; height: 120px; background: #fff; border-radius: 12px; padding: 6px; border: 2px solid var(--line); flex: none; }
  .code { font: 800 20px/1 "Baloo 2", monospace; letter-spacing: 3px; background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 4px 10px; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 100; max-width: calc(100vw - 32px);
    padding: 10px 18px; border-radius: 16px; font-weight: 800; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  #toast.info { background: #e6f5e4; color: var(--ok); } #toast.error { background: #fde8e4; color: #a33a22; }
</style>
</head>
<body>
<main id="app" hidden>
  <div class="topbar">
    <h1 id="kidName">Groszaki</h1>
    <div class="kidtabs" id="kidTabs"></div>
    <span class="ml-auto note" id="modeNote"></span>
    <button class="pill dark" id="parentBtn" data-t="app.strefaRodzica"></button>
    <button class="pill" id="unlinkBtn" data-t="app.odlacz" hidden></button>
  </div>

  <div class="saldo">
    <div class="big" id="big"><span id="zl">0</span>,<span id="gr">00</span><span class="micro" id="mic" role="button" tabindex="0">0000</span><span class="cur">zł</span></div>
    <div class="sub" id="crew"></div>
    <div class="tip" id="tip" hidden></div>
  </div>

  <div class="map-wrap" id="mapWrap"><canvas></canvas></div>

  <h2 class="sec" data-t="cele.tytul"></h2>
  <div id="goals"></div>

  <footer data-t="app.tytul"></footer>
</main>

<!-- Ekran powitalny -->
<div id="welcome" hidden>
  <div class="box">
    <img id="welcomeImg" alt="" />
    <h2 data-t="start.witaj"></h2>
    <p data-t="start.opis"></p>
    <div class="msg err" id="wError" hidden></div>
    <div class="stack">
      <button class="btn" id="wParent" data-t="start.rodzic"></button>
      <button class="btn light" id="wKid" data-t="start.dziecko"></button>
      <p class="note" id="wKidInfo" data-t="start.dzieckoInfo" hidden></p>
      <button class="btn light" id="wLocal" data-t="start.probny"></button>
    </div>
  </div>
</div>

<!-- Logowanie -->
<dialog id="authDialog">
  <form class="dlg" id="authForm">
    <div class="tabs2">
      <button type="button" class="authTab" data-auth="login" data-t="auth.logowanie"></button>
      <button type="button" class="authTab" data-auth="signup" data-t="auth.nowe"></button>
    </div>
    <label class="field"><span data-t="auth.email"></span><input id="authEmail" type="email" autocomplete="email" required /></label>
    <label class="field"><span data-t="auth.haslo"></span><input id="authPass" type="password" minlength="8" required /></label>
    <div class="row" style="justify-content: space-between; align-items: center;">
      <button class="btn" id="authSubmit" type="submit"></button>
      <button class="btn light small" id="authForgot" type="button" data-t="auth.zapomnialem"></button>
      <button class="btn light small" id="authClose" type="button" data-t="auth.zamknij"></button>
    </div>
    <div class="msg" id="authMsg" hidden></div>
  </form>
</dialog>

<!-- Założenie rodziny -->
<dialog id="onboardDialog">
  <div class="dlg">
    <h3 data-t="onb.tytul"></h3>
    <form id="obCreate" class="row">
      <label class="field"><span data-t="onb.imie"></span><input id="obKid" maxlength="30" required /></label>
      <button class="btn" data-t="onb.zaloz"></button>
    </form>
    <p class="note" data-t="onb.albo"></p>
    <form id="obJoin" class="row">
      <label class="field"><span data-t="onb.kod"></span><input id="obCode" maxlength="12" required style="text-transform: uppercase" /></label>
      <button class="btn light" data-t="onb.dolacz"></button>
    </form>
    <div class="row" style="justify-content: flex-end"><button class="btn light small" id="obLogout" data-t="onb.wyloguj"></button></div>
  </div>
</dialog>

<!-- Zagadka przed strefą rodzica (tryb próbny) -->
<dialog id="gateDialog">
  <form class="dlg" id="gateForm">
    <h3 data-t="gate.tytul"></h3>
    <label class="field"><span id="gateQ"></span><input id="gateA" inputmode="numeric" autocomplete="off" /></label>
    <div class="msg err" id="gateErr" data-t="gate.zle" hidden></div>
    <div class="row"><button class="btn" data-t="gate.dalej"></button><button type="button" class="btn light" id="gateClose" data-t="rz.zamknij"></button></div>
  </form>
</dialog>

<!-- Strefa rodzica -->
<dialog id="parentDialog">
  <div class="head">
    <div class="row" style="align-items: center;">
      <h3 data-t="rz.tytul"></h3>
      <button class="btn light small ml-auto" id="parentClose" data-t="rz.zamknij"></button>
    </div>
    <div class="ptabs" id="ptabs"></div>
  </div>
  <div class="psec" id="psec"></div>
</dialog>

<div id="toast" hidden></div>

<script>
  // Klucz publiczny Supabase – tabele są zamknięte, wszystko idzie przez funkcje,
  // które same sprawdzają uprawnienia (supabase/schema.sql + supabase/migracje/).
  window.GROSZAKI_CONFIG = {
    supabaseUrl: 'https://kjvwvgvwsdtlfogliizz.supabase.co',
    supabaseKey: 'sb_publishable_1PE_924lLY417qyhUExM3w_NJAzfloC',
  };
</script>
<script type="module" src="./src/groszaki/app.js"></script>
</body>
</html>
