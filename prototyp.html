<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groszaki – miasteczko</title>
<style>
  :root { --bg: #fdf6e7; --ink: #4a2c1a; --card: #fffaf0; --line: #ecd9b8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }
  h2 { font-size: 16px; margin: 18px 0 8px; }
  .saldo { text-align: center; margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
  .saldo .big { font-size: clamp(34px, 11vw, 56px); font-weight: 800; letter-spacing: -0.5px; transition: color .4s, text-shadow .4s; }
  .saldo .big.flash { color: #c27a00; text-shadow: 0 0 14px rgba(255, 200, 60, .7); }
  .saldo .micro { font-size: .45em; font-weight: 700; opacity: .7; vertical-align: -0.1em; margin-left: 1px; }
  .saldo .cur { font-size: .55em; font-weight: 700; margin-left: 6px; }
  .saldo .sub { font-size: 13px; opacity: .7; }
  .map-wrap { position: relative; width: 100%; aspect-ratio: 2000 / 1116; border-radius: 16px;
    overflow: hidden; border: 2px solid var(--line); background: #f1e3c6; touch-action: none; user-select: none; }
  @media (max-width: 600px) { .map-wrap { aspect-ratio: 4 / 5; } }
  .map-wrap canvas { display: block; width: 100%; height: 100%; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .controls button { font: inherit; border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; color: var(--ink); cursor: pointer; }
  .controls button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .controls .in { border-color: #8fc98f; }
  .controls .out { border-color: #e7b07a; }
  .note { font-size: 13px; opacity: .75; }
  .studio { background: var(--card); border: 2px solid var(--line); border-radius: 16px; }
  #studio { display: block; width: 100%; height: 380px; }
  @media (max-width: 600px) { #studio { height: 520px; } }
</style>
</head>
<body>
<main>
  <div class="saldo">
    <div class="big" id="big"><span id="zl">0</span>,<span id="gr">00</span><span class="micro" id="mic">0000</span><span class="cur">zł</span></div>
    <div class="sub" id="crew"></div>
  </div>

  <div class="map-wrap" id="mapWrap"><canvas></canvas></div>

  <div class="controls">
    <button class="in" data-dep="10">Wpłać 10 zł</button>
    <button class="in" data-dep="50">Wpłać 50 zł</button>
    <button class="in" data-dep="300">Wpłać 300 zł</button>
    <button class="in" data-dep="1000">Wpłać 1000 zł</button>
    <button class="out" data-wd="30">Wypłać 30 zł</button>
    <button class="out" data-wd="all">Wypłać wszystko</button>
  </div>
  <div class="controls" id="seasonBtns"></div>
  <p class="note">Przeciągnij, żeby przesunąć mapę; kółko myszy lub dwa palce przybliżają. Dotknij Groszaka.
    Prototyp: dane tylko w tej karcie. <a href="?edytor=1">Edytor tras</a></p>

  <h2>Studio póz</h2>
  <div class="studio"><canvas id="studio"></canvas></div>
</main>

<script type="module">
import { Miasteczko, MIASTECZKO_CSS } from './src/groszaki/miasteczko.js';
import { createGroszak, drawGroszak } from './src/groszaki/kukielka.js';
import { zl, balanceAt, tickTime, splitAmount, crossedFullGrosz, maxWithdrawal, DEFAULT_RATES, TICK_MS } from './src/groszaki/finanse.js';

const params = new URLSearchParams(location.search);
const style = document.createElement('style');
style.textContent = MIASTECZKO_CSS;
document.head.appendChild(style);

const fmt = new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN', maximumFractionDigits: 0 });
const formatMoney = (micro) => fmt.format(Math.round(micro / 1e6));

const town = new Miasteczko(document.getElementById('mapWrap'), {
  formatMoney,
  season: params.get('pora') || undefined,
});
await town.load();

// ---------------------------------------------------------------- dziennik (prototyp: w pamięci)
const start = Number(params.get('saldo') ?? 120);
const events = start > 0 ? [{ id: 'start', type: 'deposit', ts: Date.now() - 3 * 86400000, amount: zl(start) }] : [];
const threshold = DEFAULT_RATES.threshold;
let shown = balanceAt(events, tickTime(Date.now()));

function render(b) {
  const s = splitAmount(b);
  document.getElementById('zl').textContent = new Intl.NumberFormat('pl-PL').format(s.zl);
  document.getElementById('gr').textContent = s.gr;
  document.getElementById('mic').textContent = s.micro;
  const c = town.sim.crew;
  document.getElementById('crew').textContent = c.count
    ? `Groszaki w miasteczku: ${c.count}${c.far ? ` (na farmie ${c.far})` : ''}${c.count >= 80 ? ` · każdy ≈ ${formatMoney(c.perGroszak)}` : ''}`
    : 'Skarbiec jest pusty';
}
town.setBalance(shown, threshold, 'init');
render(shown);

// tyknięcie co 10 s, równo z zegarem: nowe saldo + okruszki do Skarbca jednocześnie
function scheduleTick() {
  const now = Date.now();
  setTimeout(() => {
    const b = balanceAt(events, tickTime(Date.now()));
    if (crossedFullGrosz(shown, b)) {
      const el = document.getElementById('big');
      el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 900);
    }
    shown = b;
    town.tick();
    town.setBalance(b, threshold, 'tick');
    render(b);
    scheduleTick();
  }, TICK_MS - (now % TICK_MS) + 5);
}
scheduleTick();

let seq = 0;
for (const b of document.querySelectorAll('[data-dep]')) {
  b.onclick = () => {
    events.push({ id: 'd' + (++seq), type: 'deposit', ts: Date.now(), amount: zl(Number(b.dataset.dep)) });
    shown = balanceAt(events, Date.now());
    town.setBalance(shown, threshold, 'deposit');
    render(shown);
  };
}
for (const b of document.querySelectorAll('[data-wd]')) {
  b.onclick = () => {
    const max = maxWithdrawal(events, Date.now());
    const amt = b.dataset.wd === 'all' ? max : Math.min(max, zl(Number(b.dataset.wd)));
    if (amt <= 0) return;
    events.push({ id: 'w' + (++seq), type: 'withdrawal', ts: Date.now(), amount: amt });
    shown = balanceAt(events, Date.now());
    town.setBalance(shown, threshold, 'withdrawal');
    render(shown);
  };
}

// pory roku
const NAMES = { spring: 'Wiosna', summer: 'Lato', autumn: 'Jesień', winter: 'Zima' };
const sb = document.getElementById('seasonBtns');
for (const s of Object.keys(NAMES)) {
  const b = document.createElement('button');
  b.textContent = NAMES[s];
  b.setAttribute('aria-pressed', s === town.season);
  b.onclick = async () => {
    await town.setSeason(s);
    for (const x of sb.children) x.setAttribute('aria-pressed', x === b);
  };
  sb.appendChild(b);
}

if (params.has('sledz')) town.follow = true;
if (params.has('edytor')) {
  const { Edytor } = await import('./src/groszaki/edytor.js');
  new Edytor(town);
}
town.start();

// ---------------------------------------------------------------- studio póz
const studio = document.getElementById('studio');
const sctx = studio.getContext('2d');
const m = town.material;
const poses = [
  ['stoi', createGroszak(m, { action: 'idle' })],
  ['drepcze', createGroszak(m, { action: 'walk' })],
  ['niesie okruszek', createGroszak(m, { action: 'walk', carry: true })],
  ['macha', createGroszak(m, { action: 'wave' })],
  ['śpi', createGroszak(m, { action: 'sleep' })],
];
const packers = Object.keys(m.packs).map((c, i) => createGroszak(m, { action: 'walk', pack: true, dir: i % 2 ? -1 : 1, packColor: c }));
town.on('frame', (now) => {
  const r = studio.getBoundingClientRect();
  if (!r.width || r.bottom < 0 || r.top > innerHeight) return;   // poza ekranem – nie rysuj
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (studio.width !== w || studio.height !== h) { studio.width = w; studio.height = h; }
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, r.width, r.height);
  const cols = r.width < 600 ? 3 : poses.length;
  const rows = Math.ceil(poses.length / cols) + 1;
  const cell = r.width / cols, rowH = r.height / rows;
  const D = Math.min(cell * 0.6, rowH * 0.5, 105);
  sctx.fillStyle = '#4a2c1a'; sctx.font = '600 13px system-ui'; sctx.textAlign = 'center';
  poses.forEach(([label, pg], i) => {
    const row = Math.floor(i / cols);
    pg.size = D; pg.x = cell * (i % cols + 0.5); pg.y = rowH * (row + 1) - 30;
    drawGroszak(sctx, pg, now, dpr, town.still);
    sctx.fillText(label, pg.x, rowH * (row + 1) - 8);
  });
  const pc = r.width / packers.length;
  const Dp = Math.min(pc * 0.55, rowH * 0.42, 70);
  packers.forEach((pg, i) => {
    pg.size = Dp; pg.x = pc * (i + 0.5); pg.y = r.height - 30;
    drawGroszak(sctx, pg, now, dpr, town.still);
  });
  sctx.fillText('wyruszają po marzenie – plecaki w różnych kolorach', r.width / 2, r.height - 8);
});
window.town = town;
</script>
</body>
</html>
